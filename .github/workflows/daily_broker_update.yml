name: Daily Broker Update

on:
  schedule:
    - cron: "30 13 * * 1-5"  # UTC 13:30 = 台灣時間 21:30,確保券商分點資料已經更新完成
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install FinMind requests

      - name: 更新現有股票的最新一天資料
        run: python daily_update.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}

      - name: 每日新增一批股票,逐步涵蓋全市場
        run: python expand_universe.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
