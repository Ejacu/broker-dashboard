name: Daily Broker Update

on:
  schedule:
    # 主排程:UTC 13:47 = 台灣時間 21:47(週一到週五)。FinMind 分點資料通常 21 點後才完整,
    # 原本 19:17 偏早;刻意避開整點(GitHub 官方建議:整點最壅塞,排程容易延遲或被直接丟棄)。
    - cron: "47 13 * * 1-5"
    # 備援:UTC 20:47 = 台灣時間隔天 04:47(週二到週六)。GitHub 偶爾會直接丟棄排程(2026-11-09~11 實際發生過),
    # 備援跑一次會自動補漏(有缺口才補,沒缺口很快結束)。
    - cron: "47 20 * * 2-6"
  workflow_dispatch: {}

# 主排程與備援不要同時跑,避免疊加打 FinMind API 超過速率上限
concurrency:
  group: daily-broker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04  # 固定版本,避免 ubuntu-latest 遷移到新版映像(2026-10-19 起)時環境突然跟著變動
    timeout-minutes: 150  # 原本 60,股票數擴增到近千檔後跑不完會被 GitHub 強制 cancelled(不是失敗,但資料更新不完整),拉大留足夠空間
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install FinMind requests

      - name: 更新現有股票的最新一天資料
        run: python daily_update.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          # 暫時拉大到 20 天(2026-10 訂閱中斷造成的缺口還在追,追完後可以改回 10 或刪掉這行)
          LOOKBACK_DAYS: "20"
