<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>單一股票區間查詢 — 分點籌碼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="topnav-brand">
      <span class="topnav-brand-name">分點籌碼</span>
      <span class="topnav-brand-tag">Taiwan Broker Flow</span>
    </a>
    <nav class="topnav-tabs">
      <a href="stock.html" class="topnav-tab">依股票</a>
      <a href="broker.html" class="topnav-tab">依券商</a>
      <a href="range_stock.html" class="topnav-tab active">區間查詢</a>
    </nav>
  </div>
</header>

<main class="shell-tool">

  <form class="query-form" onsubmit="return false;">
    <div class="field" style="flex: 1 1 200px;">
      <label for="q-stock">股票代號</label>
      <input id="q-stock" list="stockList" placeholder="例如 2330" />
      <datalist id="stockList"></datalist>
    </div>
    <div class="field" style="flex: 0 1 160px;">
      <label for="q-start">起</label>
      <input id="q-start" type="date" class="num" />
    </div>
    <div class="field" style="flex: 0 1 160px;">
      <label for="q-end">迄</label>
      <input id="q-end" type="date" class="num" />
    </div>
    <button type="button" class="btn" onclick="loadRange()">查詢</button>
    <a href="range_broker.html" class="text-link">改查單一券商在全市場的區間</a>
  </form>

  <section class="table-panel">
    <div class="table-panel-head">
      <h2 class="table-panel-title">各券商區間彙總</h2>
      <span class="table-panel-note">依淨買賣排序</span>
    </div>
    <div class="stat-row" id="rangeStats"></div>
    <div class="table-scroll">
      <table class="data-table" id="resultTable">
        <thead>
          <tr>
            <th data-col="broker">券商</th>
            <th class="sort-th" data-col="buy_avg" onclick="sortTable('buy_avg')">買均價</th>
            <th class="sort-th" data-col="sell_avg" onclick="sortTable('sell_avg')">賣均價</th>
            <th class="sort-th" data-col="total_buy_lots" onclick="sortTable('total_buy_lots')">總買進</th>
            <th class="sort-th" data-col="total_sell_lots" onclick="sortTable('total_sell_lots')">總賣出</th>
            <th class="sort-th active" data-col="net_lots" onclick="sortTable('net_lots')">淨買賣超</th>
          </tr>
        </thead>
        <tbody id="resultBody"><tr><td colspan="6" class="loading-note">請輸入股票代號與日期區間後查詢</td></tr></tbody>
      </table>
    </div>

    <div id="detailPanel" style="display:none; border-top: 1px dashed var(--border); margin-top: 8px;">
      <div style="padding: 14px 16px 0; font-size: 14px; font-weight: 700;" id="detailTitle"></div>
      <div class="table-scroll" style="padding: 10px 16px 16px;">
        <table class="data-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>買均價</th>
              <th>賣均價</th>
              <th>買進</th>
              <th>賣出</th>
              <th>淨買賣超</th>
            </tr>
          </thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <footer class="page-footer">
    <span>資料來源:FinMind · 盤後彙總資料,非即時</span>
    <span>單位:張</span>
  </footer>
</main>

<script>
  const API_BASE = 'https://sgq.vwa.mybluehost.me/broker/';

  let rangeData = [];
  let sortCol = 'net_lots';
  let sortDesc = true;
  let currentStock = '';
  let currentStart = '';
  let currentEnd = '';
  let activeBroker = '';

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  function downIcon() {
    return '<svg class="sort-icon" width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M1 2.5 L4 5.5 L7 2.5" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg>';
  }
  function upIcon() {
    return '<svg class="sort-icon" width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M1 5.5 L4 2.5 L7 5.5" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg>';
  }

  function skeletonRows(cols, rows = 6) {
    let html = '';
    for (let r = 0; r < rows; r++) {
      html += '<tr>';
      for (let c = 0; c < cols; c++) {
        const w = 40 + Math.floor(Math.random() * 50);
        html += `<td><span class="skeleton-cell" style="width:${w}px;"></span></td>`;
      }
      html += '</tr>';
    }
    return html;
  }

  function staggerRows(containerEl) {
    containerEl.querySelectorAll('tr').forEach((tr, i) => {
      tr.classList.add('row-fade-in');
      tr.style.animationDelay = Math.min(i * 20, 280) + 'ms';
    });
  }

  function updateSortHeaders(col, desc) {
    const table = document.getElementById('resultTable');
    table.querySelectorAll('thead th').forEach(th => {
      th.classList.remove('active');
      th.innerHTML = th.innerText;
    });
    const activeTh = table.querySelector(`thead th[data-col="${col}"]`);
    if (activeTh) {
      activeTh.classList.add('active');
      activeTh.innerHTML = activeTh.innerText + (desc ? downIcon() : upIcon());
    }
  }

  async function init() {
    const allStockIds = await fetchJson(API_BASE + 'stocks.php');
    const dl = document.getElementById('stockList');
    dl.innerHTML = '';
    allStockIds.forEach(code => {
      const opt = document.createElement('option');
      opt.value = code;
      dl.appendChild(opt);
    });

    const params = new URLSearchParams(window.location.search);
    const today = new Date();
    const weekAgo = new Date(today);
    weekAgo.setDate(weekAgo.getDate() - 7);
    document.getElementById('q-end').value = params.get('end') || today.toISOString().slice(0, 10);
    document.getElementById('q-start').value = params.get('start') || weekAgo.toISOString().slice(0, 10);

    const stock = params.get('stock');
    if (stock) {
      document.getElementById('q-stock').value = stock;
      await loadRange();
    }
  }

  function updateUrl() {
    const url = new URL(window.location.href);
    url.searchParams.set('stock', currentStock);
    url.searchParams.set('start', currentStart);
    url.searchParams.set('end', currentEnd);
    history.replaceState({}, '', url);
  }

  async function loadRange() {
    const stock = document.getElementById('q-stock').value.trim();
    const start = document.getElementById('q-start').value;
    const end = document.getElementById('q-end').value;
    if (!stock || !start || !end) {
      alert('請輸入股票代號與日期區間');
      return;
    }
    currentStock = stock;
    currentStart = start;
    currentEnd = end;
    updateUrl();

    document.getElementById('detailPanel').style.display = 'none';
    document.getElementById('resultBody').innerHTML = skeletonRows(6);

    const data = await fetchJson(API_BASE + `range_stock_summary.php?stock=${encodeURIComponent(stock)}&start=${start}&end=${end}`);
    rangeData = data.rows || [];

    if (rangeData.length === 0) {
      document.getElementById('rangeStats').innerHTML = `<span>查無資料:<b>${stock}</b> 在 <b>${start} ~ ${end}</b> 這段期間沒有交易紀錄</span>`;
      document.getElementById('resultBody').innerHTML = '<tr><td colspan="6" class="loading-note">查無資料</td></tr>';
      return;
    }

    const totalBuy = rangeData.reduce((s, r) => s + r.total_buy_lots, 0);
    const totalSell = rangeData.reduce((s, r) => s + r.total_sell_lots, 0);
    document.getElementById('rangeStats').innerHTML = `
      <span>股票:<b class="num">${stock}</b></span>
      <span>區間:<b class="num">${start} ~ ${end}</b></span>
      <span>涉及券商數:<b class="num">${rangeData.length}</b> 家</span>
      <span>總買進:<b class="num" style="color: var(--up);">${totalBuy.toFixed(1)} 張</b></span>
      <span>總賣出:<b class="num" style="color: var(--down);">${totalSell.toFixed(1)} 張</b></span>
    `;
    renderTable();
  }

  function renderTable() {
    const items = [...rangeData].sort((a, b) => {
      let vA = a[sortCol], vB = b[sortCol];
      if (typeof vA === 'string') return sortDesc ? vB.localeCompare(vA) : vA.localeCompare(vB);
      return sortDesc ? (vB - vA) : (vA - vB);
    });

    let html = '';
    items.forEach(it => {
      const cls = it.net_lots > 0 ? 'net-up' : (it.net_lots < 0 ? 'net-down' : '');
      const activeAttr = it.broker === activeBroker ? ' style="background:var(--table-head);"' : '';
      html += `<tr${activeAttr} class="row-click" onclick="showDetail('${it.broker.replace(/'/g, "\\'")}')">
        <td class="col-name">${it.broker}</td>
        <td class="num col-muted">${it.buy_avg.toFixed(2)}</td>
        <td class="num col-muted">${it.sell_avg.toFixed(2)}</td>
        <td class="num" style="color: var(--up);">${it.total_buy_lots.toFixed(1)}</td>
        <td class="num" style="color: var(--down);">${it.total_sell_lots.toFixed(1)}</td>
        <td class="num ${cls}">${it.net_lots > 0 ? '+' : ''}${it.net_lots.toFixed(1)}</td>
      </tr>`;
    });
    document.getElementById('resultBody').innerHTML = html;
    staggerRows(document.getElementById('resultBody'));
    updateSortHeaders(sortCol, sortDesc);
  }

  function sortTable(col) {
    if (sortCol === col) sortDesc = !sortDesc;
    else { sortCol = col; sortDesc = true; }
    renderTable();
  }

  async function showDetail(broker) {
    activeBroker = broker;
    renderTable();
    document.getElementById('detailPanel').style.display = 'block';
    document.getElementById('detailTitle').innerText = `${broker} — ${currentStock} 逐日明細(${currentStart} ~ ${currentEnd})`;
    document.getElementById('detailBody').innerHTML = skeletonRows(6, 4);

    const data = await fetchJson(API_BASE + `range_detail.php?stock=${encodeURIComponent(currentStock)}&broker=${encodeURIComponent(broker)}&start=${currentStart}&end=${currentEnd}`);
    const rows = data.rows || [];
    let html = '';
    rows.forEach(r => {
      const cls = r.net_lots > 0 ? 'net-up' : (r.net_lots < 0 ? 'net-down' : '');
      html += `<tr>
        <td class="col-name num">${r.trade_date}</td>
        <td class="num col-muted">${r.buy_avg.toFixed(2)}</td>
        <td class="num col-muted">${r.sell_avg.toFixed(2)}</td>
        <td class="num" style="color: var(--up);">${r.total_buy_lots.toFixed(1)}</td>
        <td class="num" style="color: var(--down);">${r.total_sell_lots.toFixed(1)}</td>
        <td class="num ${cls}">${r.net_lots > 0 ? '+' : ''}${r.net_lots.toFixed(1)}</td>
      </tr>`;
    });
    document.getElementById('detailBody').innerHTML = html || '<tr><td colspan="6" class="loading-note">這段期間沒有交易紀錄</td></tr>';
    staggerRows(document.getElementById('detailBody'));
    document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  init().catch(err => {
    document.getElementById('resultBody').innerHTML = `<tr><td colspan="6" class="loading-note">載入失敗:${err.message}</td></tr>`;
  });
</script>
<style>
  tr.row-click { cursor: pointer; }
  tr.row-click:hover { background: var(--table-head); }
</style>
</body>
</html>
