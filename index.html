<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>台股券商分點籌碼日報</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; margin: 0; padding: 15px; background: #F3F4F6; color: #333; }
        .container { max-width: 1350px; margin: 0 auto; }
        .card { background: #FFF; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        .stock-header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #1E293B; color: #FFF; padding: 12px 20px; border-radius: 8px; margin-bottom: 15px; }
        .stock-header select { padding: 7px 12px; font-size: 15px; font-weight: bold; border-radius: 6px; border: 1px solid #475569; outline: none; background: #FFF; }

        .tab-bar { display: flex; gap: 10px; margin-bottom: 12px; border-bottom: 2px solid #E5E7EB; padding-bottom: 8px; }
        .tab-btn { border: none; background: #E5E7EB; font-size: 14px; font-weight: bold; padding: 8px 16px; border-radius: 6px; cursor: pointer; color: #4B5563; }
        .tab-btn.active { background: #2563EB; color: #FFF; }

        .search-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 4px 0; }
        .search-bar input { max-width: 320px; padding: 6px 12px; font-size: 14px; border: 1px solid #CCC; border-radius: 4px; outline: none; }
        .search-bar select { padding: 6px 12px; font-size: 14px; border: 1px solid #CCC; border-radius: 4px; outline: none; }

        .summary-stats { display: flex; gap: 18px; margin-top: 8px; font-size: 14px; font-weight: 500; align-items: center; flex-wrap: wrap; }
        .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .badge-red { background: #FEE2E2; color: #DC2626; }
        .badge-green { background: #DCFCE7; color: #16A34A; }

        .detail-row { display: flex; flex-wrap: wrap; gap: 15px; }
        .detail-chart-col { flex: 1.2; min-width: 280px; }
        .detail-table-col { flex: 0.8; min-width: 260px; }

        .table-wrap { max-height: 410px; overflow-y: auto; border: 1px solid #E5E7EB; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: right; }
        th { background: #F9FAFB; padding: 8px 10px; font-weight: 600; border-bottom: 1px solid #E5E7EB; position: sticky; top: 0; cursor: pointer; user-select: none; }
        th:hover { background: #EDF2F7; }
        th.sort-active { color: #2563EB; background: #E0E7FF; }
        td { padding: 6px 10px; border-bottom: 1px solid #F3F4F6; }
        td:first-child, th:first-child { text-align: left; }
        tr:hover { background-color: #F8FAFC; }
        .text-red { color: #DC2626; font-weight: 600; }
        .text-green { color: #16A34A; font-weight: 600; }

        .footer-note { font-size: 12px; color: #888; text-align: center; margin-top: 10px; }
        .loading { text-align: center; color: #888; padding: 40px; }
    </style>
</head>
<body>
<div class="container">
    <div class="stock-header">
        <span style="font-size: 16px; font-weight: bold;">📊 台股券商分點籌碼日報</span>
        <select id="stockDropdown" onchange="loadStock(this.value)"></select>
        <select id="dateDropdown" onchange="loadDate(this.value)"></select>
    </div>

    <div class="card">
        <div id="bubble_chart" style="height: 500px;"></div>
    </div>

    <div class="card">
        <div class="tab-bar">
            <button class="tab-btn active" id="tabBrokerBtn" onclick="switchTab('broker')">🔍 依分點查詢(看各價位明細)</button>
            <button class="tab-btn" id="tabPriceBtn" onclick="switchTab('price')">🎯 依成交價查詢(看各券商進出)</button>
        </div>

        <!-- 模式 1:依券商查詢 -->
        <div id="sectionBroker">
            <div class="search-bar">
                <label><b>搜尋券商:</b></label>
                <input type="text" id="brokerSearch" placeholder="輸入代碼或名稱(如:凱基、合庫)" oninput="filterBrokerDropdown()" />
                <select id="brokerSelect" onchange="selectBroker(this.value)"></select>
            </div>
            <div id="brokerStats" class="summary-stats"></div>
            <hr style="border: 0; border-top: 1px solid #E5E7EB; margin: 12px 0 16px 0;" />
            <div class="detail-row">
                <div class="detail-chart-col"><div id="broker_chart" style="height: 400px;"></div></div>
                <div class="detail-table-col">
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th onclick="sortBrokerTable('price')">價格(元)⇕</th>
                                    <th onclick="sortBrokerTable('buy')">買進(張)⇕</th>
                                    <th onclick="sortBrokerTable('sell')">賣出(張)⇕</th>
                                    <th onclick="sortBrokerTable('net')">淨買賣(張)⇕</th>
                                </tr>
                            </thead>
                            <tbody id="brokerTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 模式 2:依價格檔位查詢 -->
        <div id="sectionPrice" style="display: none;">
            <div class="search-bar">
                <label><b>選擇成交價位:</b></label>
                <select id="priceSelect" onchange="selectPrice(this.value)"></select>
            </div>
            <div id="priceStats" class="summary-stats"></div>
            <hr style="border: 0; border-top: 1px solid #E5E7EB; margin: 12px 0 16px 0;" />
            <div class="detail-row">
                <div class="detail-chart-col"><div id="price_chart" style="height: 400px;"></div></div>
                <div class="detail-table-col">
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th onclick="sortPriceTable('broker')">券商名稱 ⇕</th>
                                    <th id="th-buy" class="sort-active" onclick="sortPriceTable('buy_lots')">買進(張) ▼</th>
                                    <th id="th-sell" onclick="sortPriceTable('sell_lots')">賣出(張) ⇕</th>
                                    <th id="th-net" onclick="sortPriceTable('net_lots')">淨買賣(張) ⇕</th>
                                </tr>
                            </thead>
                            <tbody id="priceTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div id="tableWrap"><div class="loading">請選擇股票與日期</div></div>
    </div>

    <div class="footer-note">資料來源:FinMind(僅呈現歷史彙總資料,非即時資料)</div>
</div>

<script>
    const API_BASE = 'https://sgq.vwa.mybluehost.me/broker/'; // Bluehost 上 PHP API 的網址

    let currentStock = '';
    let currentDate = '';
    let brokerData = {};
    let priceData = {};
    let allBrokers = [];
    let allPrices = [];

    let currentTab = 'broker';
    let currentBroker = '';
    let currentPrice = '';

    let priceSortCol = 'buy_lots';
    let priceSortDesc = true;
    let brokerSortCol = 'price';
    let brokerSortDesc = true;

    async function fetchJson(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
    }

    async function init() {
        const stocks = await fetchJson(API_BASE + 'stocks.php');
        const dd = document.getElementById('stockDropdown');
        dd.innerHTML = '';
        stocks.forEach(code => {
            const opt = document.createElement('option');
            opt.value = code;
            opt.textContent = code;
            dd.appendChild(opt);
        });
        if (stocks.length > 0) {
            await loadStock(stocks[0]);
        }
    }

    async function loadStock(stockCode) {
        currentStock = stockCode;
        document.getElementById('stockDropdown').value = stockCode;

        const dates = await fetchJson(API_BASE + `dates.php?stock=${encodeURIComponent(stockCode)}`);
        const dd = document.getElementById('dateDropdown');
        dd.innerHTML = '';
        dates.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            dd.appendChild(opt);
        });
        if (dates.length > 0) {
            await loadDate(dates[0]);
        }
    }

    async function loadDate(dateStr) {
        currentDate = dateStr;
        document.getElementById('dateDropdown').value = dateStr;

        const data = await fetchJson(API_BASE + `data.php?stock=${encodeURIComponent(currentStock)}&date=${encodeURIComponent(dateStr)}`);

        renderBubbleChart(data.summary);
        renderTable(data.summary);

        brokerData = data.broker_details || {};
        allBrokers = Object.keys(brokerData).sort();

        priceData = {};
        allBrokers.forEach(b => {
            const d = brokerData[b];
            for (let i = 0; i < d.prices.length; i++) {
                const p = d.prices[i].toFixed(2);
                const bl = d.buy_lots[i];
                const sl = d.sell_lots[i];
                const nl = d.net_lots_list[i];
                if (!priceData[p]) {
                    priceData[p] = { total_buy: 0, total_sell: 0, total_volume: 0, items: [] };
                }
                priceData[p].total_buy += bl;
                priceData[p].total_sell += sl;
                priceData[p].total_volume = Math.max(priceData[p].total_buy, priceData[p].total_sell);
                priceData[p].items.push({ broker: b, buy_lots: bl, sell_lots: sl, net_lots: nl, total_lots: (bl + sl) });
            }
        });
        allPrices = Object.keys(priceData).sort((a, b) => parseFloat(b) - parseFloat(a));

        populateBrokerDropdown(allBrokers);
        populatePriceDropdown(allPrices);

        currentBroker = allBrokers[0] || '';
        currentPrice = allPrices[0] || '';

        if (currentTab === 'price') renderPrice(currentPrice);
        else renderBroker(currentBroker);
    }

    function renderBubbleChart(summaryList) {
        const buyItems = summaryList.filter(x => x.action === '買超');
        const sellItems = summaryList.filter(x => x.action === '賣超');
        const maxLots = Math.max(...summaryList.map(x => x.abs_lots), 1);
        const sizeref = 2.0 * maxLots / (55 ** 2);

        const makeTrace = (items, name, color) => ({
            x: items.map(x => x.main_avg),
            y: items.map(x => x.net_lots),
            mode: 'markers',
            name: name,
            marker: { size: items.map(x => x.abs_lots), sizemode: 'area', sizeref: sizeref, sizemin: 6, color: color, opacity: 0.75, line: { width: 1, color: '#FFFFFF' } },
            hovertemplate: "<b>%{customdata[0]}</b><br>買進均價: %{customdata[1]:.2f} 元<br>賣出均價: %{customdata[2]:.2f} 元<br>買賣超: %{y:,.1f} 張<br><extra></extra>",
            customdata: items.map(x => [x.broker, x.buy_avg, x.sell_avg])
        });

        Plotly.newPlot('bubble_chart', [
            makeTrace(buyItems, '買超分點 (紅)', '#E74C3C'),
            makeTrace(sellItems, '賣超分點 (綠)', '#27AE60')
        ], {
            title: `<b>【${currentStock}】 ${currentDate} 券商買賣日報氣泡圖</b>`,
            xaxis: { title: '成交均價 (元)', gridcolor: '#ECECEC' },
            yaxis: { title: '買賣超張數 (張)', zeroline: true, zerolinewidth: 2, zerolinecolor: '#333', gridcolor: '#ECECEC' },
            plot_bgcolor: '#FAFAFA',
            margin: { t: 50, b: 40, l: 60, r: 30 }
        }, { responsive: true });

        document.getElementById('bubble_chart').on('plotly_click', function (evtData) {
            if (evtData.points.length > 0) {
                const bName = evtData.points[0].customdata[0];
                switchTab('broker');
                selectBroker(bName);
            }
        });
    }

    function renderTable(summaryList) {
        const sorted = [...summaryList].sort((a, b) => b.net_lots - a.net_lots);
        let html = `<table><thead><tr>
            <th>券商</th><th>買均價</th><th>賣均價</th><th>買賣超(張)</th><th>總買進(張)</th><th>總賣出(張)</th>
        </tr></thead><tbody>`;
        sorted.forEach(it => {
            const cls = it.net_lots > 0 ? 'text-red' : 'text-green';
            html += `<tr>
                <td>${it.broker}</td>
                <td>${it.buy_avg.toFixed(2)}</td>
                <td>${it.sell_avg.toFixed(2)}</td>
                <td class="${cls}">${it.net_lots > 0 ? '+' : ''}${it.net_lots.toFixed(1)}</td>
                <td>${it.total_buy_lots.toFixed(1)}</td>
                <td>${it.total_sell_lots.toFixed(1)}</td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('tableWrap').innerHTML = html;
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('sectionBroker').style.display = tab === 'broker' ? 'block' : 'none';
        document.getElementById('sectionPrice').style.display = tab === 'price' ? 'block' : 'none';
        document.getElementById('tabBrokerBtn').className = 'tab-btn ' + (tab === 'broker' ? 'active' : '');
        document.getElementById('tabPriceBtn').className = 'tab-btn ' + (tab === 'price' ? 'active' : '');
        if (tab === 'price') renderPrice(currentPrice);
        else renderBroker(currentBroker);
    }

    function populateBrokerDropdown(list) {
        const bSelect = document.getElementById('brokerSelect');
        bSelect.innerHTML = '';
        list.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name; opt.textContent = name;
            bSelect.appendChild(opt);
        });
    }

    function populatePriceDropdown(list) {
        const pSelect = document.getElementById('priceSelect');
        pSelect.innerHTML = '';
        list.forEach(p => {
            const opt = document.createElement('option');
            const v = priceData[p].total_volume.toFixed(1);
            opt.value = p;
            opt.textContent = `${p} 元(成交 ${v} 張)`;
            pSelect.appendChild(opt);
        });
    }

    function filterBrokerDropdown() {
        const q = document.getElementById('brokerSearch').value.trim().toLowerCase();
        const filtered = allBrokers.filter(b => b.toLowerCase().includes(q));
        populateBrokerDropdown(filtered);
        if (filtered.length > 0) selectBroker(filtered[0]);
    }

    function selectBroker(b) {
        currentBroker = b;
        document.getElementById('brokerSelect').value = b;
        renderBroker(b);
    }
    function selectPrice(p) {
        currentPrice = p;
        document.getElementById('priceSelect').value = p;
        renderPrice(p);
    }

    function renderBroker(brokerName) {
        const d = brokerData[brokerName];
        if (!d) return;
        document.getElementById('brokerSelect').value = brokerName;

        const isNetBuy = d.net_lots >= 0;
        const buyAvgStr = d.buy_avg > 0 ? `${d.buy_avg} 元` : '--';
        const sellAvgStr = d.sell_avg > 0 ? `${d.sell_avg} 元` : '--';

        document.getElementById('brokerStats').innerHTML = `
            <span>分點:<b>${brokerName}</b></span>
            <span>買均:<b class="text-red">${buyAvgStr}</b></span>
            <span>賣均:<b class="text-green">${sellAvgStr}</b></span>
            <span>買賣超:<span class="badge ${isNetBuy ? 'badge-red' : 'badge-green'}">${d.net_lots > 0 ? '+' : ''}${d.net_lots} 張</span></span>
            <span>總買進:<b>${d.total_buy_lots} 張</b></span>
            <span>總賣出:<b>${d.total_sell_lots} 張</b></span>
        `;

        const sortedIndices = d.prices.map((p, i) => i).sort((a, b) => d.prices[a] - d.prices[b]);
        const traceBuy = { x: sortedIndices.map(i => d.prices[i]), y: sortedIndices.map(i => d.buy_lots[i]), name: '買進 (張)', type: 'bar', marker: { color: '#DC2626' } };
        const traceSell = { x: sortedIndices.map(i => d.prices[i]), y: sortedIndices.map(i => d.sell_lots[i]), name: '賣出 (張)', type: 'bar', marker: { color: '#16A34A' } };

        Plotly.newPlot('broker_chart', [traceBuy, traceSell], {
            title: `<b>各價位量能分佈</b>`,
            barmode: 'group',
            xaxis: { title: '成交價格 (元)', type: 'category' },
            yaxis: { title: '張數 (張)', gridcolor: '#F0F0F0' },
            plot_bgcolor: '#FFF',
            margin: { t: 40, b: 40, l: 50, r: 10 },
            legend: { orientation: 'h', y: 1.15 }
        }, { responsive: true });

        renderBrokerTableRows(d);
    }

    function renderBrokerTableRows(d) {
        let items = [];
        for (let i = 0; i < d.prices.length; i++) {
            items.push({ price: d.prices[i], buy: d.buy_lots[i], sell: d.sell_lots[i], net: d.net_lots_list[i] });
        }
        items.sort((a, b) => brokerSortDesc ? (b[brokerSortCol] - a[brokerSortCol]) : (a[brokerSortCol] - b[brokerSortCol]));

        let html = '';
        items.forEach(it => {
            const nClass = it.net > 0 ? 'text-red' : (it.net < 0 ? 'text-green' : '');
            html += `<tr>
                <td>${it.price.toFixed(2)}</td>
                <td class="text-red">${it.buy.toFixed(1)}</td>
                <td class="text-green">${it.sell.toFixed(1)}</td>
                <td class="${nClass}">${it.net > 0 ? '+' : ''}${it.net.toFixed(1)}</td>
            </tr>`;
        });
        document.getElementById('brokerTableBody').innerHTML = html;
    }

    function sortBrokerTable(col) {
        if (brokerSortCol === col) brokerSortDesc = !brokerSortDesc;
        else { brokerSortCol = col; brokerSortDesc = true; }
        renderBrokerTableRows(brokerData[currentBroker]);
    }

    function renderPrice(priceStr) {
        const pObj = priceData[priceStr];
        if (!pObj) return;

        document.getElementById('priceStats').innerHTML = `
            <span>價格檔位:<b>${priceStr} 元</b></span>
            <span>檔位總成交量:<b>${pObj.total_volume.toFixed(1)} 張</b></span>
            <span>總買進:<span class="text-red">${pObj.total_buy.toFixed(1)} 張</span></span>
            <span>總賣出:<span class="text-green">${pObj.total_sell.toFixed(1)} 張</span></span>
        `;

        let items = [...pObj.items];
        items.sort((a, b) => {
            let vA = a[priceSortCol], vB = b[priceSortCol];
            if (typeof vA === 'string') return priceSortDesc ? vB.localeCompare(vA) : vA.localeCompare(vB);
            return priceSortDesc ? (vB - vA) : (vA - vB);
        });

        const top15 = [...items].sort((a, b) => b.total_lots - a.total_lots).slice(0, 15).reverse();
        const traceBuy = { y: top15.map(x => x.broker), x: top15.map(x => x.buy_lots), name: '買進 (張)', type: 'bar', orientation: 'h', marker: { color: '#DC2626' } };
        const traceSell = { y: top15.map(x => x.broker), x: top15.map(x => x.sell_lots), name: '賣出 (張)', type: 'bar', orientation: 'h', marker: { color: '#16A34A' } };

        Plotly.newPlot('price_chart', [traceBuy, traceSell], {
            title: { text: `<b>${priceStr} 元 成交量前 15 大券商</b>`, font: { size: 15 }, x: 0.05, y: 0.98 },
            barmode: 'group',
            xaxis: { title: { text: '張數 (張)', standoff: 8 }, gridcolor: '#F0F0F0' },
            yaxis: { automargin: true, tickfont: { size: 12 } },
            margin: { t: 65, b: 40, l: 110, r: 15 },
            legend: { orientation: 'h', y: 1.12, x: 0.05 }
        }, { responsive: true });

        let html = '';
        items.forEach(it => {
            const nClass = it.net_lots > 0 ? 'text-red' : (it.net_lots < 0 ? 'text-green' : '');
            html += `<tr>
                <td>${it.broker}</td>
                <td class="text-red">${it.buy_lots.toFixed(1)}</td>
                <td class="text-green">${it.sell_lots.toFixed(1)}</td>
                <td class="${nClass}">${it.net_lots > 0 ? '+' : ''}${it.net_lots.toFixed(1)}</td>
            </tr>`;
        });
        document.getElementById('priceTableBody').innerHTML = html;
    }

    function sortPriceTable(col) {
        if (priceSortCol === col) priceSortDesc = !priceSortDesc;
        else { priceSortCol = col; priceSortDesc = true; }

        ['buy_lots', 'sell_lots', 'net_lots'].forEach(c => {
            const id = c === 'buy_lots' ? 'th-buy' : (c === 'sell_lots' ? 'th-sell' : 'th-net');
            const el = document.getElementById(id);
            if (el) {
                if (priceSortCol === c) {
                    el.className = 'sort-active';
                    el.innerText = el.innerText.replace(/[▲▼⇕]/g, '') + (priceSortDesc ? ' ▼' : ' ▲');
                } else {
                    el.className = '';
                    el.innerText = el.innerText.replace(/[▲▼⇕]/g, '') + ' ⇕';
                }
            }
        });
        renderPrice(currentPrice);
    }

    init().catch(err => {
        document.getElementById('tableWrap').innerHTML = `<div class="loading">載入失敗:${err.message}</div>`;
    });
</script>
</body>
</html>
